<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Classification &amp; Periodicity — Concept Map</text>

  <!-- root -->
  <rect x="440" y="52" width="240" height="46" rx="10" fill="#9333ea" stroke="#6b21a8"/>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Periodic table = prediction machine</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#ede9fe">properties periodic in atomic number Z</text>

  <!-- connectors root -> 3 pillars -->
  <path d="M560,98 L185,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L560,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L935,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 pillars -->
  <rect x="60" y="152" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="185" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Structure of the table</text>
  <text x="185" y="193" text-anchor="middle" font-size="11.5" fill="#1e40af">periods · groups · blocks</text>

  <rect x="435" y="152" width="250" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Periodic trends</text>
  <text x="560" y="193" text-anchor="middle" font-size="11.5" fill="#15803d">radius · IE · Δ_eg H · EN</text>

  <rect x="810" y="152" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="935" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Z_eff (master variable)</text>
  <text x="935" y="193" text-anchor="middle" font-size="11.5" fill="#b45309">Z − σ drives every trend</text>

  <!-- connectors to detail -->
  <path d="M185,204 L185,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560,204 L560,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M935,204 L935,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- detail boxes -->
  <rect x="60" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#334155">period = valence n</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#334155">group = valence config</text>
  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#334155">s · p · d · f blocks</text>

  <rect x="435" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="560" y="272" text-anchor="middle" font-size="12" fill="#334155">across →: radius ↓, IE ↑, EN ↑</text>
  <text x="560" y="290" text-anchor="middle" font-size="12" fill="#334155">down ↓: radius ↑, IE ↓, EN ↓</text>
  <text x="560" y="310" text-anchor="middle" font-size="12" fill="#334155">anomalies: B&lt;Be, O&lt;N</text>

  <rect x="810" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="274" text-anchor="middle" font-size="12" fill="#334155">Z_eff = Z − σ (Slater)</text>
  <text x="935" y="292" text-anchor="middle" font-size="12" fill="#334155">smaller + high Z_eff</text>
  <text x="935" y="312" text-anchor="middle" font-size="12" fill="#334155">→ holds electrons tighter</text>

  <!-- advanced band -->
  <rect x="120" y="352" width="880" height="56" rx="9" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="560" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b21a8">Advanced:</text>
  <text x="560" y="394" text-anchor="middle" font-size="12" fill="#6b21a8">Slater's rules for Z_eff · half/fully-filled anomalies · successive-IE jump → group · isoelectronic size · diagonal relationships</text>

  <!-- footer -->
  <text x="560" y="432" text-anchor="middle" font-size="11.5" fill="#64748b">Read the position → predict block, oxidation state, oxide nature and every trend</text>
</svg>
