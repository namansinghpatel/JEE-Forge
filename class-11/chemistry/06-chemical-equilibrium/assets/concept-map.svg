<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Chemical Equilibrium — Concept Map</text>

  <!-- Tier 0: root -->
  <rect x="460" y="54" width="200" height="46" rx="10" fill="#6366f1" stroke="#4338ca"/>
  <text x="560" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Chemical Equilibrium</text>

  <!-- connectors root -> tier1 -->
  <path d="M560,100 L180,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L560,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L940,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 1: three pillars -->
  <rect x="60" y="142" width="240" height="50" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="180" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Dynamic equilibrium</text>
  <text x="180" y="183" text-anchor="middle" font-size="11.5" fill="#4338ca">forward rate = reverse rate</text>

  <rect x="440" y="142" width="240" height="50" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Equilibrium constant K</text>
  <text x="560" y="183" text-anchor="middle" font-size="11.5" fill="#15803d">[products]/[reactants]</text>

  <rect x="820" y="142" width="240" height="50" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="940" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Le Chatelier's principle</text>
  <text x="940" y="183" text-anchor="middle" font-size="11.5" fill="#b45309">disturb → shifts to oppose</text>

  <!-- connectors K -> tier2 -->
  <path d="M560,192 L180,236" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,192 L460,236" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,192 L700,236" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,192 L960,236" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 2: four children of K -->
  <rect x="60" y="238" width="240" height="56" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="180" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Kc and Kp</text>
  <text x="180" y="281" text-anchor="middle" font-size="12" fill="#334155">Kp = Kc(RT)^Δn</text>

  <rect x="340" y="238" width="240" height="56" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="460" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Reaction quotient Q</text>
  <text x="460" y="281" text-anchor="middle" font-size="12" fill="#334155">Q&lt;K →   Q&gt;K ←</text>

  <rect x="620" y="238" width="240" height="56" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="740" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Degree of dissociation α</text>
  <text x="740" y="281" text-anchor="middle" font-size="12" fill="#334155">ICE table, Kp(α, P)</text>

  <rect x="900" y="238" width="160" height="56" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="980" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Homo / Hetero</text>
  <text x="980" y="281" text-anchor="middle" font-size="12" fill="#334155">omit solids/liquids</text>

  <!-- connectors Le Chatelier -> stresses -->
  <path d="M940,192 L250,340" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M940,192 L560,340" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M940,192 L870,340" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Tier 3: stresses -->
  <rect x="120" y="342" width="260" height="50" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="250" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Concentration</text>
  <text x="250" y="382" text-anchor="middle" font-size="11.5" fill="#b45309">add reactant → forward</text>

  <rect x="430" y="342" width="260" height="50" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="560" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Pressure / volume</text>
  <text x="560" y="382" text-anchor="middle" font-size="11.5" fill="#b45309">↑P → fewer-gas-moles side</text>

  <rect x="740" y="342" width="260" height="50" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="870" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Temperature</text>
  <text x="870" y="382" text-anchor="middle" font-size="11.5" fill="#b45309">changes K itself</text>

  <!-- footer note -->
  <rect x="120" y="414" width="880" height="38" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="438" text-anchor="middle" font-size="12.5" fill="#3730a3">Catalyst and inert gas at constant volume → no shift · Only temperature changes the value of K</text>
</svg>
