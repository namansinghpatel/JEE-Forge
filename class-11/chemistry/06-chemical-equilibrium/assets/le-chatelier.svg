<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Le Chatelier's principle — shift to oppose the stress</text>

  <!-- central balance idea: a seesaw -->
  <line x1="150" y1="200" x2="670" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="4,5"/>
  <text x="410" y="190" text-anchor="middle" font-size="12.5" fill="#64748b">system at equilibrium</text>

  <!-- left: reactants box -->
  <rect x="130" y="120" width="190" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="225" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Reactants</text>
  <text x="225" y="166" text-anchor="middle" font-size="11.5" fill="#1e40af">A + B</text>

  <!-- right: products box -->
  <rect x="500" y="120" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="595" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Products</text>
  <text x="595" y="166" text-anchor="middle" font-size="11.5" fill="#15803d">C + D</text>

  <!-- equilibrium double arrow between them -->
  <path d="M330,142 L490,142" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M490,158 L330,158" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- stress: add reactant (left) pushes forward -->
  <rect x="80" y="250" width="280" height="110" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="220" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Stress on the LEFT</text>
  <text x="220" y="298" text-anchor="middle" font-size="12" fill="#b45309">add reactant · remove product</text>
  <text x="220" y="320" text-anchor="middle" font-size="12" fill="#b45309">↓ pressure if left has more gas moles</text>
  <text x="220" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">→ shifts FORWARD (→)</text>
  <path d="M225,250 L225,185" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#ar)"/>

  <!-- stress: add product (right) pushes backward -->
  <rect x="460" y="250" width="280" height="110" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="600" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Stress on the RIGHT</text>
  <text x="600" y="298" text-anchor="middle" font-size="12" fill="#b45309">add product · remove reactant</text>
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#b45309">↑ pressure if right has more gas moles</text>
  <text x="600" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">← shifts BACKWARD (←)</text>
  <path d="M595,250 L595,185" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#ar)"/>

  <!-- temperature note -->
  <text x="410" y="392" text-anchor="middle" font-size="11.5" fill="#475569">Temperature shifts toward the heat-absorbing (endothermic) side AND changes the value of K — every other stress leaves K unchanged</text>
</svg>
