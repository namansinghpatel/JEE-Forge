<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Reaching dynamic equilibrium</text>

  <!-- axes -->
  <line x1="90" y1="360" x2="690" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="360" x2="90" y2="70" stroke="#334155" stroke-width="2"/>
  <text x="390" y="398" text-anchor="middle" font-size="13" fill="#334155">time →</text>
  <text x="38" y="215" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 38 215)">rate of reaction →</text>

  <!-- equilibrium time marker -->
  <line x1="430" y1="150" x2="430" y2="360" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="430" y="378" text-anchor="middle" font-size="11.5" fill="#64748b">equilibrium reached</text>

  <!-- forward rate: starts high, decays to plateau -->
  <path d="M90,100 C 230,100 330,150 430,150 L 690,150" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- reverse rate: starts at zero, rises to same plateau -->
  <path d="M90,360 C 250,360 330,150 430,150 L 690,150" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- plateau label -->
  <line x1="90" y1="150" x2="430" y2="150" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="560" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">rates equal and constant</text>

  <!-- curve labels -->
  <rect x="110" y="84" width="150" height="26" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="185" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">forward rate</text>

  <rect x="110" y="330" width="150" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="185" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">reverse rate</text>

  <!-- caption -->
  <text x="380" y="68" text-anchor="middle" font-size="12" fill="#475569">Forward rate falls, reverse rate rises — they meet, then both stay equal (both reactions still run)</text>
</svg>
