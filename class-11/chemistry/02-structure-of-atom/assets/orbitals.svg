<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Orbital shapes — s, p and d</text>

  <!-- s orbital: sphere -->
  <text x="160" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">s (l = 0)</text>
  <circle cx="160" cy="170" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="160" cy="170" r="2.5" fill="#1e3a8a"/>
  <text x="160" y="255" text-anchor="middle" font-size="11.5" fill="#475569">spherical · no angular node</text>

  <!-- p orbital: two lobes -->
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">p (l = 1)</text>
  <ellipse cx="430" cy="130" rx="30" ry="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="430" cy="210" rx="30" ry="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="360" y1="170" x2="500" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="430" cy="170" r="2.5" fill="#14532d"/>
  <text x="430" y="285" text-anchor="middle" font-size="11.5" fill="#475569">dumbbell · 1 nodal plane</text>

  <!-- d orbital: four lobes (clover) -->
  <text x="760" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">d (l = 2)</text>
  <g fill="#fef3c7" stroke="#d97706" stroke-width="2">
    <ellipse cx="760" cy="130" rx="22" ry="40" transform="rotate(45 760 170)"/>
    <ellipse cx="760" cy="210" rx="22" ry="40" transform="rotate(45 760 170)"/>
    <ellipse cx="720" cy="170" rx="22" ry="40" transform="rotate(-45 760 170)"/>
    <ellipse cx="800" cy="170" rx="22" ry="40" transform="rotate(-45 760 170)"/>
  </g>
  <circle cx="760" cy="170" r="2.5" fill="#7c2d12"/>
  <text x="760" y="285" text-anchor="middle" font-size="11.5" fill="#475569">clover · 2 nodal planes</text>

  <!-- node summary -->
  <rect x="930" y="95" width="160" height="150" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1010" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Nodes</text>
  <text x="1010" y="142" text-anchor="middle" font-size="11.5" fill="#475569">total = n − 1</text>
  <text x="1010" y="164" text-anchor="middle" font-size="11.5" fill="#475569">angular = l</text>
  <text x="1010" y="186" text-anchor="middle" font-size="11.5" fill="#475569">radial = n − l − 1</text>
  <text x="1010" y="216" text-anchor="middle" font-size="11" fill="#64748b">orbitals/subshell</text>
  <text x="1010" y="232" text-anchor="middle" font-size="11" fill="#64748b">= 2l + 1</text>
</svg>
