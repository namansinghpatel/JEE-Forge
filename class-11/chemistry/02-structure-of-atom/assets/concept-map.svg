<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Structure of Atom — Concept Map</text>

  <!-- root -->
  <rect x="450" y="52" width="220" height="46" rx="10" fill="#0ea5a3" stroke="#0f766e"/>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Where electrons are &amp; their energy</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#d0f5f2">quantised energy levels</text>

  <!-- connectors root -> 3 pillars -->
  <path d="M560,98 L185,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L560,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L935,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 pillars -->
  <rect x="60" y="152" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="185" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Bohr model &amp; spectra</text>
  <text x="185" y="193" text-anchor="middle" font-size="11.5" fill="#1e40af">one-electron species</text>

  <rect x="435" y="152" width="250" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Dual nature</text>
  <text x="560" y="193" text-anchor="middle" font-size="11.5" fill="#15803d">photon · de Broglie · uncertainty</text>

  <rect x="810" y="152" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="935" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Quantum model</text>
  <text x="935" y="193" text-anchor="middle" font-size="11.5" fill="#b45309">orbitals &amp; configuration</text>

  <!-- connectors to detail -->
  <path d="M185,204 L185,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560,204 L560,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M935,204 L935,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- detail boxes -->
  <rect x="60" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#334155">E = −13.6 Z²/n² eV</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#334155">r = 0.529 n²/Z Å</text>
  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#334155">Rydberg: ῡ = R Z²(1/n₁²−1/n₂²)</text>

  <rect x="435" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="560" y="274" text-anchor="middle" font-size="12" fill="#334155">E = hν ; λ = h/mv</text>
  <text x="560" y="292" text-anchor="middle" font-size="12" fill="#334155">photoelectric: hν = W₀ + KE</text>
  <text x="560" y="312" text-anchor="middle" font-size="12" fill="#334155">Δx·Δp ≥ h/4π</text>

  <rect x="810" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="274" text-anchor="middle" font-size="12" fill="#334155">(n, l, mₗ, mₛ)</text>
  <text x="935" y="292" text-anchor="middle" font-size="12" fill="#334155">Aufbau · Pauli · Hund</text>
  <text x="935" y="312" text-anchor="middle" font-size="12" fill="#334155">nodes = n−1</text>

  <!-- advanced band -->
  <rect x="120" y="352" width="880" height="56" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="560" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155e75">Advanced:</text>
  <text x="560" y="394" text-anchor="middle" font-size="12" fill="#155e75">spectral series &amp; series limit · radial/angular nodes · accelerated-electron λ = 12.27/√V Å · Cr/Cu exceptions, remove 4s before 3d</text>

  <!-- footer -->
  <text x="560" y="432" text-anchor="middle" font-size="11.5" fill="#64748b">Scale any hydrogen-like ion by Z²/n² (energy), 1/Z (radius), Z (velocity)</text>
</svg>
