<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Thermodynamics — Concept Map</text>

  <!-- root -->
  <rect x="455" y="52" width="210" height="46" rx="10" fill="#c2410c" stroke="#9a3412"/>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Energy bookkeeping</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#ffedd5">how much heat · will it happen?</text>

  <!-- connectors root -> 3 pillars -->
  <path d="M560,98 L185,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L560,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L935,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 pillars -->
  <rect x="60" y="152" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="185" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">First law &amp; enthalpy</text>
  <text x="185" y="193" text-anchor="middle" font-size="11.5" fill="#1e40af">ΔU = q + w · H = U + PV</text>

  <rect x="435" y="152" width="250" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Thermochemistry</text>
  <text x="560" y="193" text-anchor="middle" font-size="11.5" fill="#15803d">Hess · formation · bond enthalpy</text>

  <rect x="810" y="152" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="935" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Spontaneity</text>
  <text x="935" y="193" text-anchor="middle" font-size="11.5" fill="#b45309">entropy · Gibbs energy</text>

  <!-- connectors to detail -->
  <path d="M185,204 L185,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560,204 L560,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M935,204 L935,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- detail boxes -->
  <rect x="60" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#334155">w = −P_ext ΔV</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#334155">ΔH = ΔU + Δn_g RT</text>
  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#334155">q_V = ΔU · q_P = ΔH</text>

  <rect x="435" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="560" y="274" text-anchor="middle" font-size="12" fill="#334155">ΔrH = Σ ΔfH(prod − react)</text>
  <text x="560" y="292" text-anchor="middle" font-size="12" fill="#334155">bond: broken − formed</text>
  <text x="560" y="312" text-anchor="middle" font-size="12" fill="#334155">Hess: add / reverse / scale</text>

  <rect x="810" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="274" text-anchor="middle" font-size="12" fill="#334155">ΔS_univ &gt; 0 (spontaneous)</text>
  <text x="935" y="292" text-anchor="middle" font-size="12" fill="#334155">ΔG = ΔH − TΔS</text>
  <text x="935" y="312" text-anchor="middle" font-size="12" fill="#334155">ΔG° = −RT ln K</text>

  <!-- advanced band -->
  <rect x="120" y="352" width="880" height="56" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="560" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">Advanced:</text>
  <text x="560" y="394" text-anchor="middle" font-size="12" fill="#9a3412">bond enthalpy &amp; Born–Haber · ΔG° = −RT ln K &amp; crossover T = ΔH/ΔS · reversible vs irreversible, isothermal (ΔU=0) / adiabatic (q=0)</text>

  <!-- footer -->
  <text x="560" y="432" text-anchor="middle" font-size="11.5" fill="#64748b">Identify the constraint first: const V → ΔU · const P → ΔH · isothermal → ΔU=0 · adiabatic → q=0</text>
</svg>
