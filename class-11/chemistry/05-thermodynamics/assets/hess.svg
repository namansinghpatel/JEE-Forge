<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="he" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Hess's Law — the path doesn't matter</text>

  <!-- states -->
  <rect x="120" y="120" width="180" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="210" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Reactants</text>
  <text x="210" y="164" text-anchor="middle" font-size="11.5" fill="#1e40af">C(s) + O₂(g)</text>

  <rect x="820" y="120" width="180" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="910" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Products</text>
  <text x="910" y="164" text-anchor="middle" font-size="11.5" fill="#15803d">CO₂(g)</text>

  <!-- intermediate -->
  <rect x="470" y="250" width="180" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Intermediate</text>
  <text x="560" y="294" text-anchor="middle" font-size="11.5" fill="#b45309">CO(g) + ½O₂(g)</text>

  <!-- direct path -->
  <line x1="300" y1="148" x2="818" y2="148" stroke="#2563eb" stroke-width="2.5" marker-end="url(#he)"/>
  <text x="560" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">direct: ΔH = −393.5 kJ</text>

  <!-- step 1 -->
  <line x1="260" y1="176" x2="490" y2="258" stroke="#d97706" stroke-width="2.5" marker-end="url(#he)"/>
  <text x="330" y="235" text-anchor="middle" font-size="11.5" fill="#b45309">step 1: ΔH₁ = −110.5</text>

  <!-- step 2 -->
  <line x1="640" y1="258" x2="860" y2="176" stroke="#16a34a" stroke-width="2.5" marker-end="url(#he)"/>
  <text x="790" y="235" text-anchor="middle" font-size="11.5" fill="#166534">step 2: ΔH₂ = −283</text>

  <!-- equation -->
  <rect x="300" y="315" width="520" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">ΔH(direct) = ΔH₁ + ΔH₂ = −110.5 + (−283) = −393.5 kJ ✓</text>
</svg>
