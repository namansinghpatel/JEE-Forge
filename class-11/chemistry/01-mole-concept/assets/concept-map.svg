<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Mole Concept — Concept Map</text>

  <!-- connectors from hub -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="520" y1="205" x2="300" y2="112"/>
    <line x1="600" y1="205" x2="850" y2="112"/>
    <line x1="635" y1="213" x2="878" y2="213"/>
    <line x1="520" y1="236" x2="290" y2="328"/>
    <line x1="560" y1="236" x2="560" y2="328"/>
    <line x1="600" y1="236" x2="830" y2="328"/>
  </g>

  <!-- conversion labels -->
  <text x="368" y="150" text-anchor="middle" font-size="11" fill="#475569">× M  /  ÷ M</text>
  <text x="742" y="150" text-anchor="middle" font-size="11" fill="#475569">× Nₐ  /  ÷ Nₐ</text>
  <text x="757" y="203" text-anchor="middle" font-size="11" fill="#475569">× 22.4 L (STP)</text>

  <!-- Hub -->
  <rect x="485" y="190" width="150" height="46" rx="10" fill="#2563eb"/>
  <text x="560" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MOLE  (n)</text>
  <text x="560" y="228" text-anchor="middle" font-size="10" fill="#dbeafe">6.022 × 10²³ particles</text>

  <!-- Top-left: Mass -->
  <rect x="150" y="70" width="200" height="42" rx="8" fill="#059669"/>
  <text x="250" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Mass of substance (g)</text>

  <!-- Top-right: Number -->
  <rect x="760" y="70" width="270" height="42" rx="8" fill="#7c3aed"/>
  <text x="895" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Number of particles (atoms/molecules/ions)</text>

  <!-- Right: Volume -->
  <rect x="880" y="190" width="190" height="46" rx="8" fill="#ea580c"/>
  <text x="975" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Volume of gas at STP</text>

  <!-- Bottom-left: Stoichiometry -->
  <rect x="120" y="330" width="240" height="42" rx="8" fill="#0891b2"/>
  <text x="240" y="356" text-anchor="middle" font-size="12" fill="#fff">Stoichiometry (balanced eqns)</text>

  <!-- Bottom-centre: Formulae -->
  <rect x="445" y="330" width="230" height="42" rx="8" fill="#dc2626"/>
  <text x="560" y="356" text-anchor="middle" font-size="12" fill="#fff">Empirical &amp; Molecular formula</text>

  <!-- Bottom-right: Concentration -->
  <rect x="760" y="330" width="280" height="42" rx="8" fill="#64748b"/>
  <text x="900" y="356" text-anchor="middle" font-size="12" fill="#fff">Concentration (molarity, molality…)</text>
</svg>
