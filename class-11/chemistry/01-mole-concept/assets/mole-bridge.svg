<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="as" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L2,3 L8,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">The Mole Bridge</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">Always convert to moles first — it is the airport every route connects through</text>

  <!-- Mass box -->
  <rect x="40" y="120" width="200" height="54" rx="10" fill="#059669"/>
  <text x="140" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Mass (g)</text>
  <text x="140" y="164" text-anchor="middle" font-size="10" fill="#d1fae5">what we weigh</text>

  <!-- Moles box -->
  <rect x="400" y="120" width="200" height="54" rx="10" fill="#2563eb"/>
  <text x="500" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MOLES (n)</text>
  <text x="500" y="164" text-anchor="middle" font-size="10" fill="#dbeafe">the hub</text>

  <!-- Number box -->
  <rect x="760" y="120" width="210" height="54" rx="10" fill="#7c3aed"/>
  <text x="865" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Number of particles</text>
  <text x="865" y="164" text-anchor="middle" font-size="10" fill="#ede9fe">what we count</text>

  <!-- Volume box -->
  <rect x="400" y="245" width="200" height="54" rx="10" fill="#ea580c"/>
  <text x="500" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Volume of gas (L)</text>
  <text x="500" y="289" text-anchor="middle" font-size="10" fill="#ffedd5">at STP</text>

  <!-- Mass <-> Moles -->
  <line x1="248" y1="147" x2="392" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#ae)" marker-start="url(#as)"/>
  <text x="320" y="135" text-anchor="middle" font-size="11" fill="#334155">÷ M  (to moles)</text>
  <text x="320" y="167" text-anchor="middle" font-size="11" fill="#334155">× M  (to grams)</text>

  <!-- Moles <-> Number -->
  <line x1="608" y1="147" x2="752" y2="147" stroke="#334155" stroke-width="2" marker-end="url(#ae)" marker-start="url(#as)"/>
  <text x="680" y="135" text-anchor="middle" font-size="11" fill="#334155">× Nₐ</text>
  <text x="680" y="167" text-anchor="middle" font-size="11" fill="#334155">÷ Nₐ</text>

  <!-- Moles <-> Volume -->
  <line x1="500" y1="178" x2="500" y2="241" stroke="#334155" stroke-width="2" marker-end="url(#ae)" marker-start="url(#as)"/>
  <text x="610" y="205" text-anchor="middle" font-size="11" fill="#334155">× 22.4 L  /  ÷ 22.4  (gas, STP)</text>
</svg>
