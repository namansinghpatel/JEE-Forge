<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Limiting Reagent</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#334155">2 H₂ + O₂ → 2 H₂O    (start with 2 mol H₂ and 2 mol O₂)</text>

  <!-- H2 stack -->
  <text x="150" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">H₂  (2 mol)</text>
  <rect x="95" y="110" width="110" height="45" rx="6" fill="#2563eb"/>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#fff">1 mol · used</text>
  <rect x="95" y="162" width="110" height="45" rx="6" fill="#2563eb"/>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#fff">1 mol · used</text>
  <text x="150" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">runs out → limiting</text>

  <!-- O2 stack -->
  <text x="370" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">O₂  (2 mol)</text>
  <rect x="315" y="110" width="110" height="45" rx="6" fill="#ea580c"/>
  <text x="370" y="138" text-anchor="middle" font-size="12" fill="#fff">1 mol · used</text>
  <rect x="315" y="162" width="110" height="45" rx="6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="370" y="190" text-anchor="middle" font-size="12" fill="#64748b">1 mol · left over</text>
  <text x="370" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">in excess</text>

  <!-- arrow to product -->
  <line x1="470" y1="165" x2="600" y2="165" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="535" y="152" text-anchor="middle" font-size="12" fill="#334155">forms</text>

  <!-- product -->
  <rect x="610" y="135" width="260" height="60" rx="10" fill="#059669"/>
  <text x="740" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2 mol H₂O</text>
  <text x="740" y="182" text-anchor="middle" font-size="11" fill="#d1fae5">set by the limiting reagent (H₂)</text>

  <!-- caption -->
  <line x1="60" y1="280" x2="900" y2="280" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="308" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="700">H₂ needs only 1 mol O₂, so H₂ runs out first → H₂ is the limiting reagent.</text>
  <text x="480" y="332" text-anchor="middle" font-size="12" fill="#475569">It decides the amount of product (2 mol H₂O). The extra 1 mol O₂ is left over (excess).</text>
  <text x="480" y="356" text-anchor="middle" font-size="11.5" fill="#64748b">Find it by comparing moles ÷ coefficient — never by which reactant has more grams or moles.</text>
</svg>
