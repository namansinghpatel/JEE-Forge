<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="is" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Isomerism — same formula, different structure</text>

  <!-- root -->
  <rect x="470" y="54" width="180" height="42" rx="9" fill="#7c3aed" stroke="#5b21b6"/>
  <text x="560" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Isomers</text>

  <path d="M560,96 L300,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#is)"/>
  <path d="M560,96 L820,140" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#is)"/>

  <!-- structural -->
  <rect x="150" y="142" width="300" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="300" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Structural (constitutional)</text>

  <!-- stereo -->
  <rect x="670" y="142" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="820" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Stereoisomerism</text>

  <!-- structural children -->
  <g font-size="11.5" fill="#1e40af">
    <rect x="70" y="210" width="110" height="34" rx="7" fill="#ffffff" stroke="#2563eb"/><text x="125" y="232" text-anchor="middle">chain</text>
    <rect x="190" y="210" width="110" height="34" rx="7" fill="#ffffff" stroke="#2563eb"/><text x="245" y="232" text-anchor="middle">position</text>
    <rect x="310" y="210" width="120" height="34" rx="7" fill="#ffffff" stroke="#2563eb"/><text x="370" y="232" text-anchor="middle">functional</text>
    <rect x="130" y="252" width="120" height="34" rx="7" fill="#ffffff" stroke="#2563eb"/><text x="190" y="274" text-anchor="middle">metamerism</text>
    <rect x="260" y="252" width="120" height="34" rx="7" fill="#ffffff" stroke="#2563eb"/><text x="320" y="274" text-anchor="middle">tautomerism</text>
  </g>

  <!-- stereo children -->
  <g font-size="11.5" fill="#166534">
    <rect x="690" y="210" width="130" height="34" rx="7" fill="#ffffff" stroke="#16a34a"/><text x="755" y="232" text-anchor="middle">geometrical (cis–trans)</text>
    <rect x="830" y="210" width="130" height="34" rx="7" fill="#ffffff" stroke="#16a34a"/><text x="895" y="232" text-anchor="middle">optical (chirality)</text>
  </g>
  <text x="820" y="274" text-anchor="middle" font-size="11.5" fill="#475569">needs rigid C=C / ring (geom.) or 4 different groups on C (optical)</text>

  <text x="560" y="325" text-anchor="middle" font-size="11.5" fill="#64748b">Structural = different connectivity · Stereo = same connectivity, different 3-D arrangement</text>
</svg>
