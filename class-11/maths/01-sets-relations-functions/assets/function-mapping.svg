<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Functions — one-one vs onto</text>

  <!-- one-one into -->
  <text x="190" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">One-one (injective)</text>
  <ellipse cx="110" cy="170" rx="46" ry="80" fill="#eff6ff" stroke="#2563eb"/>
  <ellipse cx="270" cy="170" rx="46" ry="80" fill="#eff6ff" stroke="#2563eb"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#1e40af">A</text>
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#1e40af">B</text>
  <circle cx="110" cy="150" r="4" fill="#1d4ed8"/><circle cx="110" cy="190" r="4" fill="#1d4ed8"/>
  <circle cx="270" cy="135" r="4" fill="#1d4ed8"/><circle cx="270" cy="170" r="4" fill="#1d4ed8"/><circle cx="270" cy="205" r="4" fill="#1d4ed8"/>
  <line x1="114" y1="150" x2="266" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <line x1="114" y1="190" x2="266" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#475569">distinct inputs → distinct outputs</text>

  <!-- onto -->
  <text x="560" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Onto (surjective)</text>
  <ellipse cx="480" cy="170" rx="46" ry="80" fill="#f0fdf4" stroke="#16a34a"/>
  <ellipse cx="640" cy="170" rx="46" ry="80" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#166534">A</text>
  <text x="640" y="100" text-anchor="middle" font-size="11" fill="#166534">B</text>
  <circle cx="480" cy="140" r="4" fill="#15803d"/><circle cx="480" cy="170" r="4" fill="#15803d"/><circle cx="480" cy="200" r="4" fill="#15803d"/>
  <circle cx="640" cy="150" r="4" fill="#15803d"/><circle cx="640" cy="190" r="4" fill="#15803d"/>
  <line x1="484" y1="140" x2="636" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <line x1="484" y1="170" x2="636" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <line x1="484" y1="200" x2="636" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <text x="560" y="270" text-anchor="middle" font-size="11" fill="#475569">every output is hit (range = codomain)</text>

  <!-- bijective -->
  <text x="930" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">Bijective (both)</text>
  <ellipse cx="850" cy="170" rx="46" ry="80" fill="#fffbeb" stroke="#d97706"/>
  <ellipse cx="1010" cy="170" rx="46" ry="80" fill="#fffbeb" stroke="#d97706"/>
  <text x="850" y="100" text-anchor="middle" font-size="11" fill="#92400e">A</text>
  <text x="1010" y="100" text-anchor="middle" font-size="11" fill="#92400e">B</text>
  <circle cx="850" cy="145" r="4" fill="#b45309"/><circle cx="850" cy="195" r="4" fill="#b45309"/>
  <circle cx="1010" cy="145" r="4" fill="#b45309"/><circle cx="1010" cy="195" r="4" fill="#b45309"/>
  <line x1="854" y1="145" x2="1006" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <line x1="854" y1="195" x2="1006" y2="195" stroke="#475569" stroke-width="1.5" marker-end="url(#fm)"/>
  <text x="930" y="270" text-anchor="middle" font-size="11" fill="#475569">one-one + onto → invertible</text>
</svg>
