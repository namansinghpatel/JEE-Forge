<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Venn Diagrams — the four operations</text>

  <!-- Union -->
  <text x="160" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">A ∪ B</text>
  <rect x="70" y="85" width="180" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="135" cy="160" r="48" fill="#bfdbfe" fill-opacity="0.8" stroke="#2563eb"/>
  <circle cx="185" cy="160" r="48" fill="#bfdbfe" fill-opacity="0.8" stroke="#2563eb"/>
  <text x="110" y="165" font-size="12" fill="#1e3a8a">A</text><text x="205" y="165" font-size="12" fill="#1e3a8a">B</text>

  <!-- Intersection -->
  <text x="410" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">A ∩ B</text>
  <rect x="320" y="85" width="180" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="385" cy="160" r="48" fill="none" stroke="#16a34a"/>
  <circle cx="435" cy="160" r="48" fill="none" stroke="#16a34a"/>
  <path d="M410,120 A48,48 0 0,1 410,200 A48,48 0 0,1 410,120 Z" fill="#bbf7d0" fill-opacity="0.9"/>
  <text x="360" y="165" font-size="12" fill="#14532d">A</text><text x="455" y="165" font-size="12" fill="#14532d">B</text>

  <!-- Difference -->
  <text x="660" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">A − B</text>
  <rect x="570" y="85" width="180" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <clipPath id="clipA"><circle cx="635" cy="160" r="48"/></clipPath>
  <circle cx="635" cy="160" r="48" fill="#fde68a" fill-opacity="0.9" stroke="#d97706"/>
  <circle cx="685" cy="160" r="48" fill="#ffffff" clip-path="url(#clipA)"/>
  <circle cx="635" cy="160" r="48" fill="none" stroke="#d97706"/>
  <circle cx="685" cy="160" r="48" fill="none" stroke="#d97706"/>
  <text x="610" y="165" font-size="12" fill="#92400e">A</text><text x="705" y="165" font-size="12" fill="#92400e">B</text>

  <!-- Complement -->
  <text x="930" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">A′ (in U)</text>
  <rect x="840" y="85" width="180" height="150" rx="6" fill="#fecdd3" fill-opacity="0.7" stroke="#be123c"/>
  <circle cx="930" cy="160" r="48" fill="#ffffff" stroke="#be123c"/>
  <text x="925" y="165" font-size="12" fill="#9f1239">A</text>
  <text x="995" y="105" font-size="11" fill="#9f1239">U</text>

  <text x="560" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">De Morgan: (A∪B)′ = A′∩B′ · (A∩B)′ = A′∪B′</text>
</svg>
