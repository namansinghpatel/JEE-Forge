<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="sm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Sequences &amp; Series — concept map</text>

  <!-- central node -->
  <rect x="470" y="60" width="180" height="48" rx="10" fill="#1e293b"/>
  <text x="560" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Sequence a_n</text>
  <text x="560" y="99" text-anchor="middle" font-size="11.5" fill="#cbd5e1">series S_n = Σ a_k</text>

  <!-- AP -->
  <rect x="70" y="150" width="210" height="96" rx="10" fill="#eaf1ff" stroke="#2563eb"/>
  <text x="175" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Arithmetic (AP)</text>
  <text x="175" y="196" text-anchor="middle" font-size="12" fill="#334155">a_n = a + (n−1)d</text>
  <text x="175" y="216" text-anchor="middle" font-size="12" fill="#334155">S_n = n/2 [2a+(n−1)d]</text>
  <text x="175" y="235" text-anchor="middle" font-size="11" fill="#64748b">constant difference d</text>
  <line x1="490" y1="92" x2="235" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#sm)"/>

  <!-- GP -->
  <rect x="320" y="150" width="210" height="96" rx="10" fill="#e9f8ef" stroke="#15803d"/>
  <text x="425" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Geometric (GP)</text>
  <text x="425" y="196" text-anchor="middle" font-size="12" fill="#334155">a_n = a r^(n−1)</text>
  <text x="425" y="216" text-anchor="middle" font-size="12" fill="#334155">S_∞ = a/(1−r), |r|&lt;1</text>
  <text x="425" y="235" text-anchor="middle" font-size="11" fill="#64748b">constant ratio r</text>
  <line x1="520" y1="108" x2="455" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#sm)"/>

  <!-- Means -->
  <rect x="590" y="150" width="210" height="96" rx="10" fill="#fdf3e3" stroke="#b45309"/>
  <text x="695" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">Means &amp; HP</text>
  <text x="695" y="196" text-anchor="middle" font-size="12" fill="#334155">AM ≥ GM ≥ HM</text>
  <text x="695" y="216" text-anchor="middle" font-size="12" fill="#334155">GM² = AM·HM</text>
  <text x="695" y="235" text-anchor="middle" font-size="11" fill="#64748b">HP: reciprocals in AP</text>
  <line x1="600" y1="108" x2="665" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#sm)"/>

  <!-- Special sums -->
  <rect x="840" y="150" width="210" height="96" rx="10" fill="#fdeaef" stroke="#be123c"/>
  <text x="945" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">Special sums</text>
  <text x="945" y="196" text-anchor="middle" font-size="12" fill="#334155">Σk, Σk², Σk³</text>
  <text x="945" y="216" text-anchor="middle" font-size="12" fill="#334155">Σk³ = (Σk)²</text>
  <text x="945" y="235" text-anchor="middle" font-size="11" fill="#64748b">split by linearity</text>
  <line x1="630" y1="96" x2="890" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#sm)"/>

  <!-- Advanced band -->
  <text x="560" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">ADVANCED — pick the tool by the n-th term's structure</text>

  <rect x="90" y="310" width="220" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="200" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">AGP</text>
  <text x="200" y="355" text-anchor="middle" font-size="11.5" fill="#334155">(linear)×(geometric)</text>
  <text x="200" y="374" text-anchor="middle" font-size="11.5" fill="#334155">multiply-by-r, subtract</text>

  <rect x="340" y="310" width="220" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="450" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Telescoping</text>
  <text x="450" y="355" text-anchor="middle" font-size="11.5" fill="#334155">reciprocal of product</text>
  <text x="450" y="374" text-anchor="middle" font-size="11.5" fill="#334155">partial fractions</text>

  <rect x="590" y="310" width="220" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="700" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Vₙ method</text>
  <text x="700" y="355" text-anchor="middle" font-size="11.5" fill="#334155">consecutive products</text>
  <text x="700" y="374" text-anchor="middle" font-size="11.5" fill="#334155">k(k+1)...(k+m−1)</text>

  <rect x="840" y="310" width="210" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="945" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">AM–GM</text>
  <text x="945" y="355" text-anchor="middle" font-size="11.5" fill="#334155">optimisation</text>
  <text x="945" y="374" text-anchor="middle" font-size="11.5" fill="#334155">split → product const</text>

  <text x="560" y="422" text-anchor="middle" font-size="11.5" fill="#64748b">Identify the n-th term first — AP/GP/means for standard forms, then AGP · telescoping · Vₙ · AM–GM for the rest.</text>
</svg>
