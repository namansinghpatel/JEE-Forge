<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Quadratic Equations — Concept Map</text>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="515" y1="205" x2="300" y2="112"/>
    <line x1="600" y1="205" x2="840" y2="112"/>
    <line x1="635" y1="213" x2="878" y2="213"/>
    <line x1="515" y1="236" x2="300" y2="328"/>
    <line x1="560" y1="236" x2="560" y2="328"/>
    <line x1="600" y1="236" x2="830" y2="328"/>
  </g>

  <!-- Hub -->
  <rect x="485" y="190" width="150" height="46" rx="10" fill="#2563eb"/>
  <text x="560" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Quadratic</text>
  <text x="560" y="227" text-anchor="middle" font-size="11" fill="#dbeafe">ax² + bx + c = 0</text>

  <!-- Top-left: Solve -->
  <rect x="150" y="70" width="210" height="42" rx="8" fill="#059669"/>
  <text x="255" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Solve: factorise / formula</text>

  <!-- Top-right: Discriminant -->
  <rect x="740" y="70" width="280" height="42" rx="8" fill="#dc2626"/>
  <text x="880" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Discriminant  D = b² − 4ac</text>
  <text x="880" y="106" text-anchor="middle" font-size="10.5" fill="#fee2e2">→ nature of roots</text>

  <!-- Right: Graph -->
  <rect x="880" y="190" width="190" height="46" rx="8" fill="#ea580c"/>
  <text x="975" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Graph: parabola</text>
  <text x="975" y="226" text-anchor="middle" font-size="10.5" fill="#ffedd5">vertex, max/min</text>

  <!-- Bottom-left: Vieta -->
  <rect x="90" y="330" width="290" height="42" rx="8" fill="#7c3aed"/>
  <text x="235" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Vieta: α+β = −b/a,  αβ = c/a</text>
  <text x="235" y="366" text-anchor="middle" font-size="10.5" fill="#ede9fe">symmetric functions of roots</text>

  <!-- Bottom-centre: Form/transform -->
  <rect x="440" y="330" width="230" height="42" rx="8" fill="#0891b2"/>
  <text x="555" y="356" text-anchor="middle" font-size="12" fill="#fff">Form / transform roots</text>

  <!-- Bottom-right: Location -->
  <rect x="760" y="330" width="280" height="42" rx="8" fill="#64748b"/>
  <text x="900" y="356" text-anchor="middle" font-size="12" fill="#fff">Root location, sign &amp; common roots</text>
</svg>
