<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Discriminant — three cases (parabola vs the x-axis)</text>

  <!-- Panel 1: D > 0 -->
  <line x1="55" y1="230" x2="305" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <path d="M70,150 Q180,330 290,150" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="113" cy="230" r="5" fill="#dc2626"/>
  <circle cx="247" cy="230" r="5" fill="#dc2626"/>
  <text x="180" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">D &gt; 0</text>
  <text x="180" y="300" text-anchor="middle" font-size="12" fill="#0f172a">cuts axis at 2 points</text>
  <text x="180" y="320" text-anchor="middle" font-size="11.5" fill="#475569">two distinct real roots</text>

  <!-- Panel 2: D = 0 -->
  <line x1="375" y1="230" x2="625" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <path d="M390,150 Q500,310 610,150" fill="none" stroke="#059669" stroke-width="3"/>
  <circle cx="500" cy="230" r="5" fill="#dc2626"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">D = 0</text>
  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#0f172a">touches axis at 1 point</text>
  <text x="500" y="320" text-anchor="middle" font-size="11.5" fill="#475569">one repeated real root</text>

  <!-- Panel 3: D < 0 -->
  <line x1="695" y1="230" x2="945" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <path d="M710,150 Q820,250 930,150" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="820" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">D &lt; 0</text>
  <text x="820" y="300" text-anchor="middle" font-size="12" fill="#0f172a">never meets the axis</text>
  <text x="820" y="320" text-anchor="middle" font-size="11.5" fill="#475569">complex conjugate roots</text>
</svg>
