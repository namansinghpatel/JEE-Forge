<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">The Parabola  y = ax² + bx + c</text>

  <!-- x-axis -->
  <line x1="90" y1="170" x2="610" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="174" font-size="12" fill="#64748b">x</text>
  <!-- y-axis -->
  <line x1="350" y1="60" x2="350" y2="330" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- axis of symmetry -->
  <line x1="350" y1="60" x2="350" y2="330" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="358" y="320" font-size="11" fill="#7c3aed">axis x = −b/2a</text>

  <!-- parabola (opens up) -->
  <path d="M160,80 Q350,360 540,80" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- roots on axis -->
  <circle cx="243" cy="170" r="5" fill="#dc2626"/>
  <circle cx="457" cy="170" r="5" fill="#dc2626"/>
  <text x="243" y="158" text-anchor="middle" font-size="11" fill="#dc2626">α</text>
  <text x="457" y="158" text-anchor="middle" font-size="11" fill="#dc2626">β</text>
  <text x="350" y="150" text-anchor="middle" font-size="10.5" fill="#475569">roots = x-intercepts</text>

  <!-- vertex -->
  <circle cx="350" cy="220" r="5" fill="#059669"/>
  <text x="430" y="238" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">Vertex (−b/2a, −D/4a)</text>

  <!-- opening note -->
  <text x="560" y="110" font-size="12.5" fill="#2563eb" font-weight="700">a &gt; 0: opens up</text>
  <text x="560" y="128" font-size="11.5" fill="#475569">→ has a minimum = −D/4a</text>

  <!-- caption -->
  <line x1="60" y1="350" x2="840" y2="350" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#0f172a">If a &lt; 0 the parabola opens downward (∩) and the vertex gives the <tspan font-weight="700">maximum</tspan> value instead.</text>
</svg>
