<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Parabola  y² = 4ax  (opens right)</text>

  <!-- axes -->
  <line x1="60" y1="240" x2="640" y2="240" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="632" y="258" font-size="12" fill="#94a3b8">x (axis)</text>

  <!-- vertex at (180,240); focus at (260,240) a=80 px; directrix x=100 -->
  <!-- parabola path: y²=4a x, for x from 0..~190 -->
  <path d="M180,240
           C 180,180 200,120 260,90
           M180,240
           C 180,300 200,360 260,390"
        fill="none" stroke="#16a34a" stroke-width="2.6"/>
  <!-- better single smooth path -->
  <path d="M 260,90 Q 150,160 180,240 Q 150,320 260,390" fill="none" stroke="#16a34a" stroke-width="2.6"/>

  <!-- directrix -->
  <line x1="100" y1="80" x2="100" y2="400" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="104" y="96" font-size="12.5" font-weight="700" fill="#b91c1c">directrix  x = −a</text>

  <!-- vertex -->
  <circle cx="180" cy="240" r="4.5" fill="#15803d"/>
  <text x="150" y="262" font-size="12.5" font-weight="700" fill="#15803d">vertex</text>

  <!-- focus -->
  <circle cx="260" cy="240" r="4.5" fill="#1d4ed8"/>
  <text x="250" y="262" font-size="12.5" font-weight="700" fill="#1d4ed8">focus (a, 0)</text>

  <!-- latus rectum through focus -->
  <line x1="260" y1="150" x2="260" y2="330" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="260" cy="150" r="4" fill="#7c3aed"/>
  <circle cx="260" cy="330" r="4" fill="#7c3aed"/>
  <text x="268" y="145" font-size="12" fill="#6d28d9">(a, 2a)</text>
  <text x="268" y="345" font-size="12" fill="#6d28d9">(a, −2a)</text>
  <text x="300" y="200" font-size="12.5" font-weight="700" fill="#6d28d9">latus rectum = 4a</text>

  <!-- equal distance illustration -->
  <text x="330" y="110" font-size="12.5" fill="#334155">PS = PM  (distance to focus = distance to directrix)</text>

  <!-- info box -->
  <rect x="60" y="400" width="560" height="48" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="80" y="422" font-size="12.5" fill="#065f46">vertex (0,0) · focus (a,0) · directrix x = −a · axis: x-axis · parametric point (at², 2at)</text>
  <text x="80" y="440" font-size="12.5" fill="#065f46">other forms: y²=−4ax (left), x²=4ay (up), x²=−4ay (down)</text>
</svg>
