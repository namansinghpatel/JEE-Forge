<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Conic Sections — Concept Map</text>

  <!-- root -->
  <rect x="430" y="52" width="260" height="48" rx="10" fill="#6366f1" stroke="#4338ca"/>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Conic = distance to focus</text>
  <text x="560" y="91" text-anchor="middle" font-size="12.5" fill="#e0e7ff">= e × distance to directrix</text>

  <!-- connectors root -> four conics -->
  <path d="M560,100 L150,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L430,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L690,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,100 L970,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- four conic boxes -->
  <rect x="40" y="152" width="220" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">Circle · e = 0</text>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#1e40af">x² + y² = r²</text>

  <rect x="320" y="152" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="430" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Parabola · e = 1</text>
  <text x="430" y="196" text-anchor="middle" font-size="12" fill="#15803d">y² = 4ax</text>

  <rect x="600" y="152" width="220" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="710" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Ellipse · 0 &lt; e &lt; 1</text>
  <text x="710" y="196" text-anchor="middle" font-size="12" fill="#b45309">x²/a² + y²/b² = 1</text>

  <rect x="880" y="152" width="220" height="60" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="990" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9d174d">Hyperbola · e &gt; 1</text>
  <text x="990" y="196" text-anchor="middle" font-size="12" fill="#be185d">x²/a² − y²/b² = 1</text>

  <!-- feature row connectors -->
  <path d="M150,212 L150,258" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M430,212 L430,258" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M710,212 L710,258" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M990,212 L990,258" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- feature boxes -->
  <rect x="40" y="260" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#334155">centre (−g, −f)</text>
  <text x="150" y="301" text-anchor="middle" font-size="12" fill="#334155">radius √(g²+f²−c)</text>
  <text x="150" y="318" text-anchor="middle" font-size="12" fill="#334155">tangent xx₁+yy₁=r²</text>

  <rect x="320" y="260" width="220" height="64" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="430" y="282" text-anchor="middle" font-size="12" fill="#334155">focus (a,0), dir x=−a</text>
  <text x="430" y="301" text-anchor="middle" font-size="12" fill="#334155">latus rectum = 4a</text>
  <text x="430" y="318" text-anchor="middle" font-size="12" fill="#334155">point (at², 2at)</text>

  <rect x="600" y="260" width="220" height="64" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="710" y="282" text-anchor="middle" font-size="12" fill="#334155">foci (±ae, 0)</text>
  <text x="710" y="301" text-anchor="middle" font-size="12" fill="#334155">b² = a²(1−e²)</text>
  <text x="710" y="318" text-anchor="middle" font-size="12" fill="#334155">PS₁+PS₂ = 2a</text>

  <rect x="880" y="260" width="220" height="64" rx="10" fill="#ffffff" stroke="#db2777"/>
  <text x="990" y="282" text-anchor="middle" font-size="12" fill="#334155">foci (±ae, 0)</text>
  <text x="990" y="301" text-anchor="middle" font-size="12" fill="#334155">b² = a²(e²−1)</text>
  <text x="990" y="318" text-anchor="middle" font-size="12" fill="#334155">asymptotes y=±(b/a)x</text>

  <!-- footer -->
  <rect x="120" y="356" width="880" height="56" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="379" text-anchor="middle" font-size="12.5" fill="#3730a3">Geometry: slice a double cone — flat → circle, tilt → ellipse, parallel to slant → parabola, steep → hyperbola.</text>
  <text x="560" y="399" text-anchor="middle" font-size="12.5" fill="#3730a3">One tangent rule for all: "T = 0" (x²→xx₁, y²→yy₁). Ellipse &amp; hyperbola are a mirror pair (one sign flip).</text>
</svg>
