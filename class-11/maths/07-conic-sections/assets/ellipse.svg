<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Ellipse  x²/a² + y²/b² = 1  (a &gt; b)</text>

  <!-- centre (340,210); a=200 px, b=110 px -->
  <!-- axes -->
  <line x1="100" y1="210" x2="580" y2="210" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="340" y1="70" x2="340" y2="350" stroke="#cbd5e1" stroke-width="1.3"/>

  <ellipse cx="340" cy="210" rx="200" ry="110" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="2.6"/>

  <!-- centre -->
  <circle cx="340" cy="210" r="4" fill="#92400e"/>

  <!-- vertices -->
  <circle cx="140" cy="210" r="4.5" fill="#b45309"/>
  <circle cx="540" cy="210" r="4.5" fill="#b45309"/>
  <text x="112" y="230" font-size="12" fill="#92400e">(−a, 0)</text>
  <text x="516" y="230" font-size="12" fill="#92400e">(a, 0)</text>

  <!-- foci: c=ae; put at ±150 -->
  <circle cx="190" cy="210" r="5" fill="#dc2626"/>
  <circle cx="490" cy="210" r="5" fill="#dc2626"/>
  <text x="168" y="200" font-size="12" font-weight="700" fill="#b91c1c">S₁(−ae,0)</text>
  <text x="464" y="200" font-size="12" font-weight="700" fill="#b91c1c">S₂(ae,0)</text>

  <!-- a point P on ellipse with focal radii -->
  <circle cx="420" cy="118" r="4.5" fill="#1d4ed8"/>
  <text x="428" y="112" font-size="12" font-weight="700" fill="#1d4ed8">P</text>
  <line x1="190" y1="210" x2="420" y2="118" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="490" y1="210" x2="420" y2="118" stroke="#2563eb" stroke-width="1.8"/>

  <!-- minor axis label -->
  <line x1="340" y1="210" x2="340" y2="100" stroke="#0891b2" stroke-width="1.8"/>
  <text x="346" y="150" font-size="12" font-weight="700" fill="#0e7490">b</text>

  <!-- major axis label -->
  <text x="258" y="202" font-size="12" font-weight="700" fill="#92400e">a</text>

  <!-- defining property -->
  <rect x="100" y="360" width="480" height="66" rx="9" fill="#fffbeb" stroke="#fde68a"/>
  <text x="120" y="384" font-size="13" font-weight="700" fill="#92400e">PS₁ + PS₂ = 2a  (sum of focal distances is constant)</text>
  <text x="120" y="406" font-size="12.5" fill="#b45309">b² = a²(1 − e²) · foci (±ae, 0) · directrices x = ±a/e · latus rectum 2b²/a</text>
  <text x="120" y="422" font-size="12.5" fill="#b45309">e = √(1 − b²/a²),  0 &lt; e &lt; 1</text>
</svg>
