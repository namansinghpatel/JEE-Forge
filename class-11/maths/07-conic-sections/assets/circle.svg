<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Circle — centre and radius</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="560" y2="250" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="310" y1="60" x2="310" y2="430" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="552" y="268" font-size="12" fill="#94a3b8">x</text>
  <text x="318" y="72" font-size="12" fill="#94a3b8">y</text>

  <!-- circle centred at (h,k) shifted right/up a bit -->
  <circle cx="360" cy="210" r="120" fill="#dbeafe" fill-opacity="0.5" stroke="#2563eb" stroke-width="2.5"/>

  <!-- centre -->
  <circle cx="360" cy="210" r="4.5" fill="#1d4ed8"/>
  <text x="372" y="206" font-size="13" font-weight="700" fill="#1d4ed8">C (h, k)</text>

  <!-- radius line -->
  <line x1="360" y1="210" x2="480" y2="210" stroke="#dc2626" stroke-width="2.2"/>
  <text x="408" y="200" font-size="13" font-weight="700" fill="#b91c1c">r</text>
  <circle cx="480" cy="210" r="4" fill="#dc2626"/>
  <text x="470" y="230" font-size="12" fill="#b91c1c">P (x, y)</text>

  <!-- equation callouts -->
  <rect x="60" y="330" width="520" height="104" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="80" y="356" font-size="13.5" font-weight="700" fill="#1e3a8a">Standard:  (x − h)² + (y − k)² = r²</text>
  <text x="80" y="382" font-size="13.5" font-weight="700" fill="#1e3a8a">General:  x² + y² + 2gx + 2fy + c = 0</text>
  <text x="80" y="406" font-size="12.5" fill="#1e40af">centre = (−g, −f)   ·   radius = √(g² + f² − c)</text>
  <text x="80" y="426" font-size="12.5" fill="#1e40af">every point P is a fixed distance r from the centre C</text>
</svg>
