<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="680" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Hyperbola  x²/a² − y²/b² = 1</text>

  <!-- centre (340,215) -->
  <line x1="60" y1="215" x2="620" y2="215" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="340" y1="60" x2="340" y2="375" stroke="#cbd5e1" stroke-width="1.3"/>

  <!-- asymptotes y = ± (b/a) x : through centre, slope ~ 0.7 -->
  <line x1="130" y1="68" x2="550" y2="362" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5"/>
  <line x1="130" y1="362" x2="550" y2="68" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="556" y="360" font-size="11.5" fill="#64748b">y = (b/a)x</text>
  <text x="556" y="76" font-size="11.5" fill="#64748b">y = −(b/a)x</text>

  <!-- right branch -->
  <path d="M 400,68 Q 300,160 300,215 Q 300,270 400,362" fill="none" stroke="#db2777" stroke-width="2.6"/>
  <!-- left branch -->
  <path d="M 280,68 Q 380,160 380,215 Q 380,270 280,362" fill="none" stroke="#db2777" stroke-width="2.6"/>

  <!-- vertices -->
  <circle cx="300" cy="215" r="4.5" fill="#be185d"/>
  <circle cx="380" cy="215" r="4.5" fill="#be185d"/>
  <text x="270" y="206" font-size="11.5" fill="#9d174d">(−a,0)</text>
  <text x="384" y="206" font-size="11.5" fill="#9d174d">(a,0)</text>

  <!-- foci further out -->
  <circle cx="230" cy="215" r="5" fill="#dc2626"/>
  <circle cx="450" cy="215" r="5" fill="#dc2626"/>
  <text x="206" y="235" font-size="11.5" font-weight="700" fill="#b91c1c">S₁(−ae,0)</text>
  <text x="426" y="235" font-size="11.5" font-weight="700" fill="#b91c1c">S₂(ae,0)</text>

  <!-- centre dot -->
  <circle cx="340" cy="215" r="3.5" fill="#334155"/>

  <!-- info box -->
  <rect x="60" y="392" width="560" height="56" rx="9" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="80" y="414" font-size="12.5" fill="#9d174d">|PS₁ − PS₂| = 2a (difference of focal distances) · b² = a²(e²−1) · e = √(1+b²/a²) &gt; 1</text>
  <text x="80" y="434" font-size="12.5" fill="#9d174d">asymptotes y = ±(b/a)x · latus rectum 2b²/a · rectangular when a = b (e = √2)</text>
</svg>
