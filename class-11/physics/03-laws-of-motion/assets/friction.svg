<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Friction — self-adjusting, then constant</text>

  <!-- left: the physical picture -->
  <text x="300" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Block pushed on a rough floor</text>
  <line x1="100" y1="210" x2="500" y2="210" stroke="#64748b" stroke-width="3"/>
  <!-- hatching -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="210" x2="110" y2="224"/><line x1="160" y1="210" x2="150" y2="224"/>
    <line x1="200" y1="210" x2="190" y2="224"/><line x1="240" y1="210" x2="230" y2="224"/>
    <line x1="280" y1="210" x2="270" y2="224"/><line x1="320" y1="210" x2="310" y2="224"/>
    <line x1="360" y1="210" x2="350" y2="224"/><line x1="400" y1="210" x2="390" y2="224"/>
    <line x1="440" y1="210" x2="430" y2="224"/><line x1="480" y1="210" x2="470" y2="224"/>
  </g>
  <rect x="250" y="160" width="100" height="50" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="300" y="190" text-anchor="middle" font-size="12" fill="#1e40af">m</text>
  <!-- applied force -->
  <line x1="350" y1="185" x2="460" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fr)"/>
  <text x="420" y="178" font-size="12" fill="#2563eb">F (applied)</text>
  <!-- friction -->
  <line x1="250" y1="185" x2="150" y2="185" stroke="#d97706" stroke-width="2.5" marker-end="url(#fr)"/>
  <text x="150" y="178" font-size="12" fill="#d97706">f</text>
  <text x="300" y="260" text-anchor="middle" font-size="11.5" fill="#475569">N = mg · f opposes the push (or its tendency)</text>

  <!-- right: f vs F graph -->
  <text x="830" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Friction vs applied force</text>
  <!-- axes -->
  <line x1="640" y1="300" x2="1030" y2="300" stroke="#334155" stroke-width="1.6" marker-end="url(#fr)"/>
  <line x1="640" y1="300" x2="640" y2="90" stroke="#334155" stroke-width="1.6" marker-end="url(#fr)"/>
  <text x="1030" y="320" font-size="12" fill="#334155">applied force F</text>
  <text x="648" y="100" font-size="12" fill="#334155">friction f</text>
  <!-- static region: f = F (45 line) up to peak -->
  <line x1="640" y1="300" x2="820" y2="150" stroke="#2563eb" stroke-width="2.5"/>
  <text x="700" y="210" font-size="11.5" fill="#2563eb" transform="rotate(-40 700 210)">static: f = F</text>
  <!-- peak -->
  <circle cx="820" cy="150" r="4" fill="#dc2626"/>
  <line x1="640" y1="150" x2="820" y2="150" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="648" y="145" font-size="11" fill="#dc2626">μsN</text>
  <!-- drop to kinetic -->
  <line x1="820" y1="150" x2="820" y2="172" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 2"/>
  <!-- kinetic: roughly constant -->
  <line x1="820" y1="172" x2="1010" y2="172" stroke="#d97706" stroke-width="2.5"/>
  <line x1="640" y1="172" x2="820" y2="172" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="648" y="188" font-size="11" fill="#d97706">μkN</text>
  <text x="915" y="165" font-size="11.5" fill="#d97706">kinetic: f = μkN</text>
  <text x="835" y="140" font-size="11" fill="#dc2626">slips here</text>
</svg>
