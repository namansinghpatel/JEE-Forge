<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="um" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Units &amp; Measurements — concept map</text>

  <!-- central node -->
  <rect x="455" y="58" width="210" height="50" rx="10" fill="#13294b"/>
  <text x="560" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Measurement = n × unit</text>
  <text x="560" y="98" text-anchor="middle" font-size="11.5" fill="#cbd5e1">7 SI base quantities</text>

  <!-- Dimensions -->
  <rect x="70" y="150" width="210" height="96" rx="10" fill="#eaf1ff" stroke="#2563eb"/>
  <text x="175" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Dimensions</text>
  <text x="175" y="195" text-anchor="middle" font-size="12" fill="#334155">[MᵃLᵇTᶜ ...]</text>
  <text x="175" y="214" text-anchor="middle" font-size="11.5" fill="#334155">[F]=[MLT⁻²], [E]=[ML²T⁻²]</text>
  <text x="175" y="233" text-anchor="middle" font-size="11" fill="#64748b">derived from base quantities</text>
  <line x1="480" y1="100" x2="235" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#um)"/>

  <!-- Homogeneity -->
  <rect x="320" y="150" width="210" height="96" rx="10" fill="#e9f8ef" stroke="#15803d"/>
  <text x="425" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Homogeneity</text>
  <text x="425" y="195" text-anchor="middle" font-size="11.5" fill="#334155">all terms same dimensions</text>
  <text x="425" y="213" text-anchor="middle" font-size="11.5" fill="#334155">check equations</text>
  <text x="425" y="232" text-anchor="middle" font-size="11" fill="#64748b">&amp; convert units</text>
  <line x1="520" y1="108" x2="455" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#um)"/>

  <!-- Sig figs -->
  <rect x="590" y="150" width="210" height="96" rx="10" fill="#fdf3e3" stroke="#b45309"/>
  <text x="695" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">Significant figures</text>
  <text x="695" y="195" text-anchor="middle" font-size="11.5" fill="#334155">×,÷ → fewest s.f.</text>
  <text x="695" y="213" text-anchor="middle" font-size="11.5" fill="#334155">+,− → fewest decimals</text>
  <text x="695" y="232" text-anchor="middle" font-size="11" fill="#64748b">round once, at the end</text>
  <line x1="600" y1="108" x2="665" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#um)"/>

  <!-- Errors -->
  <rect x="840" y="150" width="210" height="96" rx="10" fill="#fdeaef" stroke="#be123c"/>
  <text x="945" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#be123c">Errors</text>
  <text x="945" y="195" text-anchor="middle" font-size="11.5" fill="#334155">abs · relative · %</text>
  <text x="945" y="213" text-anchor="middle" font-size="11.5" fill="#334155">sums: add absolute</text>
  <text x="945" y="232" text-anchor="middle" font-size="11" fill="#64748b">products: add relative ×n</text>
  <line x1="640" y1="100" x2="890" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#um)"/>

  <!-- Advanced band -->
  <text x="560" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">ADVANCED — dimensions as a toolkit</text>

  <rect x="150" y="310" width="250" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="275" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Power-law method</text>
  <text x="275" y="355" text-anchor="middle" font-size="11.5" fill="#334155">Q = k aˣbʸcᶻ</text>
  <text x="275" y="374" text-anchor="middle" font-size="11.5" fill="#334155">equate M,L,T powers</text>

  <rect x="435" y="310" width="250" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="560" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Limitations</text>
  <text x="560" y="355" text-anchor="middle" font-size="11.5" fill="#334155">no constant k, no sin/exp</text>
  <text x="560" y="374" text-anchor="middle" font-size="11.5" fill="#334155">no multi-term laws</text>

  <rect x="720" y="310" width="250" height="86" rx="10" fill="#f1ebfe" stroke="#6d28d9"/>
  <text x="845" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Precision vs accuracy</text>
  <text x="845" y="355" text-anchor="middle" font-size="11.5" fill="#334155">least count, order of mag.</text>
  <text x="845" y="374" text-anchor="middle" font-size="11.5" fill="#334155">report x̄ ± Δx</text>

  <text x="560" y="422" text-anchor="middle" font-size="11.5" fill="#64748b">Dimensions check and derive; significant figures and error propagation make a measurement honest.</text>
</svg>
