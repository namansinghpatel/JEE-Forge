<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Kinematics — Concept Map</text>

  <!-- root -->
  <rect x="455" y="52" width="210" height="46" rx="10" fill="#6366f1" stroke="#4338ca"/>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Describing motion</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#e0e7ff">position · velocity · acceleration</text>

  <!-- connectors root -> 3 pillars -->
  <path d="M560,98 L185,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L560,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,98 L935,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 pillars -->
  <rect x="60" y="152" width="250" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="185" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Rectilinear motion</text>
  <text x="185" y="193" text-anchor="middle" font-size="11.5" fill="#1e40af">1D, along a line</text>

  <rect x="435" y="152" width="250" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Projectile motion</text>
  <text x="560" y="193" text-anchor="middle" font-size="11.5" fill="#15803d">2D, under gravity</text>

  <rect x="810" y="152" width="250" height="52" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="935" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Relative velocity</text>
  <text x="935" y="193" text-anchor="middle" font-size="11.5" fill="#b45309">motion seen from another body</text>

  <!-- connectors to detail -->
  <path d="M185,204 L185,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560,204 L560,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M935,204 L935,250" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- detail boxes -->
  <rect x="60" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#334155">constant a: v=u+at,</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#334155">s=ut+½at², v²=u²+2as</text>
  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#334155">free fall: H=u²/2g, T=2u/g</text>

  <rect x="435" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="560" y="272" text-anchor="middle" font-size="12" fill="#334155">split: horizontal (const v)</text>
  <text x="560" y="290" text-anchor="middle" font-size="12" fill="#334155">+ vertical (free fall)</text>
  <text x="560" y="310" text-anchor="middle" font-size="12" fill="#334155">R=u²sin2θ/g, max at 45°</text>

  <rect x="810" y="252" width="250" height="78" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="935" y="274" text-anchor="middle" font-size="12" fill="#334155">v(AB) = v(A) − v(B)</text>
  <text x="935" y="292" text-anchor="middle" font-size="12" fill="#334155">river-boat · rain-man</text>
  <text x="935" y="312" text-anchor="middle" font-size="12" fill="#334155">switch frame → geometry</text>

  <!-- advanced band -->
  <rect x="120" y="352" width="880" height="56" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">Advanced:</text>
  <text x="560" y="394" text-anchor="middle" font-size="12" fill="#3730a3">varying a → calculus (a = v·dv/dx) · projectile on incline / radius of curvature · closest approach by switching frames</text>

  <!-- footer -->
  <text x="560" y="432" text-anchor="middle" font-size="11.5" fill="#64748b">Graphs: slope of x–t = v · slope of v–t = a · area under v–t = displacement</text>
</svg>
