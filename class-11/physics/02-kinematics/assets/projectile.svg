<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="v" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Projectile motion — u at angle θ</text>

  <!-- ground -->
  <line x1="60" y1="320" x2="710" y2="320" stroke="#334155" stroke-width="2"/>

  <!-- trajectory (parabola) from (80,320) peak (385,120) to (690,320) -->
  <path d="M80,320 Q 385,0 690,320" fill="none" stroke="#16a34a" stroke-width="2.8"/>

  <!-- launch point and velocity components -->
  <circle cx="80" cy="320" r="4.5" fill="#15803d"/>
  <line x1="80" y1="320" x2="150" y2="265" stroke="#2563eb" stroke-width="2.4" marker-end="url(#v)"/>
  <text x="150" y="258" font-size="12.5" font-weight="700" fill="#1d4ed8">u</text>
  <!-- components -->
  <line x1="80" y1="320" x2="150" y2="320" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="150" y1="320" x2="150" y2="265" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="112" y="336" font-size="11.5" fill="#475569">u cosθ</text>
  <text x="156" y="296" font-size="11.5" fill="#475569">u sinθ</text>
  <path d="M110,320 A 30 30 0 0 0 103,302" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="118" y="314" font-size="11" fill="#334155">θ</text>

  <!-- top point -->
  <circle cx="385" cy="120" r="4" fill="#dc2626"/>
  <text x="385" y="108" text-anchor="middle" font-size="11.5" fill="#b91c1c">top: v = u cosθ (horizontal)</text>
  <!-- max height -->
  <line x1="385" y1="120" x2="385" y2="320" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="396" y="225" font-size="11.5" font-weight="700" fill="#6d28d9">H = u²sin²θ / 2g</text>

  <!-- range -->
  <line x1="80" y1="340" x2="690" y2="340" stroke="#0891b2" stroke-width="1.6"/>
  <text x="385" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">R = u² sin2θ / g   (max at θ = 45°)</text>

  <!-- info -->
  <text x="385" y="384" text-anchor="middle" font-size="11.5" fill="#475569">Time of flight T = 2u sinθ / g · horizontal velocity is constant · path is a parabola</text>
</svg>
