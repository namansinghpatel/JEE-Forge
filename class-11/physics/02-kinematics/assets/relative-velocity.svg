<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Relative velocity — two classic setups</text>

  <!-- LEFT: river-boat -->
  <text x="210" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">River–boat (crossing straight)</text>
  <rect x="60" y="80" width="300" height="230" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <!-- banks -->
  <line x1="60" y1="90" x2="360" y2="90" stroke="#60a5fa" stroke-width="2"/>
  <line x1="60" y1="300" x2="360" y2="300" stroke="#60a5fa" stroke-width="2"/>
  <text x="70" y="106" font-size="10.5" fill="#2563eb">far bank</text>
  <text x="70" y="294" font-size="10.5" fill="#2563eb">near bank</text>
  <!-- current arrow -->
  <line x1="90" y1="195" x2="160" y2="195" stroke="#0891b2" stroke-width="2.2" marker-end="url(#a1)"/>
  <text x="125" y="188" text-anchor="middle" font-size="11" fill="#0e7490">current v_r</text>
  <!-- boat heading upstream, resultant straight across -->
  <line x1="210" y1="300" x2="170" y2="110" stroke="#16a34a" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="150" y="150" font-size="11" fill="#166534">heading</text>
  <line x1="210" y1="300" x2="210" y2="110" stroke="#dc2626" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="216" y="205" font-size="11" fill="#b91c1c">resultant</text>
  <text x="210" y="332" text-anchor="middle" font-size="11" fill="#334155">aim upstream: sinθ = v_r / v_boat</text>

  <!-- RIGHT: rain-man -->
  <text x="610" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Rain–man (umbrella tilt)</text>
  <rect x="460" y="80" width="300" height="230" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <!-- rain vertical -->
  <line x1="610" y1="100" x2="610" y2="210" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="620" y="150" font-size="11" fill="#1d4ed8">rain v_rain</text>
  <!-- man velocity (reversed) -->
  <line x1="610" y1="210" x2="520" y2="210" stroke="#16a34a" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="540" y="228" font-size="11" fill="#166534">− v_man</text>
  <!-- apparent rain -->
  <line x1="610" y1="100" x2="520" y2="210" stroke="#dc2626" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="548" y="150" font-size="11" fill="#b91c1c">apparent</text>
  <text x="610" y="332" text-anchor="middle" font-size="11" fill="#334155">tilt = tan⁻¹(v_man / v_rain) from vertical</text>

  <!-- footer -->
  <text x="410" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">Both are the one rule:  v(A relative to B) = v(A) − v(B)</text>
</svg>
