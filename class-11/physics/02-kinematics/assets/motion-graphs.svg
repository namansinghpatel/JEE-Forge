<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Motion graphs — slope and area</text>

  <!-- Panel 1: x-t -->
  <text x="150" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Position–time</text>
  <line x1="50" y1="250" x2="270" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="50" y2="80" stroke="#334155" stroke-width="1.5"/>
  <text x="264" y="268" font-size="11" fill="#64748b">t</text>
  <text x="34" y="90" font-size="11" fill="#64748b">x</text>
  <path d="M50,240 Q 160,235 260,110" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <!-- tangent -->
  <line x1="150" y1="210" x2="240" y2="150" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="150" y="110" text-anchor="middle" font-size="11.5" fill="#b91c1c">slope = velocity</text>

  <!-- Panel 2: v-t -->
  <text x="450" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Velocity–time</text>
  <line x1="350" y1="250" x2="570" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="350" y1="250" x2="350" y2="80" stroke="#334155" stroke-width="1.5"/>
  <text x="564" y="268" font-size="11" fill="#64748b">t</text>
  <text x="334" y="90" font-size="11" fill="#64748b">v</text>
  <line x1="350" y1="230" x2="545" y2="110" stroke="#16a34a" stroke-width="2.6"/>
  <!-- area -->
  <path d="M350,230 L545,110 L545,250 L350,250 Z" fill="#bbf7d0" fill-opacity="0.55" stroke="none"/>
  <text x="455" y="225" text-anchor="middle" font-size="11.5" fill="#166534">area = displacement</text>
  <text x="470" y="128" text-anchor="middle" font-size="11.5" fill="#166534">slope = a</text>

  <!-- Panel 3: a-t -->
  <text x="750" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Acceleration–time</text>
  <line x1="650" y1="250" x2="870" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="650" y1="250" x2="650" y2="80" stroke="#334155" stroke-width="1.5"/>
  <text x="864" y="268" font-size="11" fill="#64748b">t</text>
  <text x="634" y="90" font-size="11" fill="#64748b">a</text>
  <line x1="650" y1="150" x2="845" y2="150" stroke="#d97706" stroke-width="2.6"/>
  <path d="M650,150 L845,150 L845,250 L650,250 Z" fill="#fde68a" fill-opacity="0.5" stroke="none"/>
  <text x="748" y="210" text-anchor="middle" font-size="11.5" fill="#92400e">area = Δv</text>

  <!-- footer -->
  <text x="450" y="300" text-anchor="middle" font-size="11.5" fill="#475569">Differentiate going left→right (x→v→a); integrate going right→left (a→v→x)</text>
</svg>
