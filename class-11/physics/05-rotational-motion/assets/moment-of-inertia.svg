<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="660" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Moment of Inertia of Common Bodies</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#64748b">dashed line = axis · mass far from axis counts more (r²)</text>

  <!-- Ring -->
  <circle cx="110" cy="130" r="45" fill="none" stroke="#2563eb" stroke-width="10"/>
  <line x1="110" y1="70" x2="110" y2="190" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="110" y="215" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">Ring</text>
  <text x="110" y="234" text-anchor="middle" font-size="13" fill="#2563eb">I = MR²</text>

  <!-- Disc -->
  <circle cx="275" cy="130" r="45" fill="#059669" opacity="0.85"/>
  <line x1="275" y1="70" x2="275" y2="190" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="275" y="215" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">Disc / Cylinder</text>
  <text x="275" y="234" text-anchor="middle" font-size="13" fill="#059669">I = ½MR²</text>

  <!-- Solid sphere -->
  <circle cx="440" cy="130" r="45" fill="#dc2626" opacity="0.85"/>
  <ellipse cx="440" cy="130" rx="45" ry="15" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="440" y1="70" x2="440" y2="190" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="440" y="215" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">Solid sphere</text>
  <text x="440" y="234" text-anchor="middle" font-size="13" fill="#dc2626">I = ⅖MR²</text>

  <!-- Rod -->
  <rect x="575" y="85" width="18" height="90" rx="4" fill="#7c3aed"/>
  <line x1="545" y1="130" x2="620" y2="130" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="584" y="215" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="700">Rod (centre)</text>
  <text x="584" y="234" text-anchor="middle" font-size="13" fill="#7c3aed">I = ML²/12</text>

  <!-- theorems -->
  <line x1="40" y1="258" x2="620" y2="258" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330" y="285" text-anchor="middle" font-size="13.5" fill="#0f172a" font-weight="700">Parallel axis:  I = I_cm + Md&#178;      |      Perp. axis (laminae only):  Iz = Ix + Iy</text>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#475569">Radius of gyration:  I = Mk²  ⇒  k = √(I/M)</text>
</svg>
