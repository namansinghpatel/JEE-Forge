<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Centre of Mass</text>

  <!-- Two-particle system -->
  <text x="160" y="60" text-anchor="middle" font-size="13" fill="#475569">Two particles</text>
  <line x1="40" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <!-- axis ticks -->
  <circle cx="70" cy="120" r="14" fill="#2563eb"/>
  <text x="70" y="125" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">m₁</text>
  <circle cx="270" cy="120" r="20" fill="#dc2626"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">m₂</text>
  <!-- COM -->
  <line x1="190" y1="95" x2="190" y2="150" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="190,150 184,138 196,138" fill="#059669"/>
  <text x="190" y="170" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">COM</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#1e293b">r₁</text>
  <text x="235" y="110" text-anchor="middle" font-size="11" fill="#1e293b">r₂</text>
  <text x="160" y="210" text-anchor="middle" font-size="13" fill="#0f172a">x꜀ₘ = (m₁x₁ + m₂x₂)/(m₁+m₂)</text>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#64748b">closer to the heavier mass</text>

  <!-- Uniform rod -->
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#475569">Uniform rod</text>
  <rect x="360" y="110" width="240" height="20" rx="4" fill="#7c3aed"/>
  <line x1="480" y1="95" x2="480" y2="150" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="480,150 474,138 486,138" fill="#059669"/>
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">COM at L/2</text>
  <text x="480" y="210" text-anchor="middle" font-size="13" fill="#0f172a">at the geometric midpoint</text>
  <text x="480" y="232" text-anchor="middle" font-size="11" fill="#64748b">(uniform ⇒ centre)</text>

  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#475569">Only external forces move the COM:  M a꜀ₘ = F₍ext₎</text>
</svg>
