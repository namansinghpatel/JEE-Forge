<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="660" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rolling Without Slipping  (v = R&#969;)</text>

  <!-- Wheel with velocity of points -->
  <text x="170" y="60" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Velocity of points</text>
  <line x1="60" y1="210" x2="290" y2="210" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="170" cy="150" r="60" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <circle cx="170" cy="150" r="4" fill="#0f172a"/>

  <!-- top point 2v -->
  <line x1="170" y1="90" x2="270" y2="90" stroke="#dc2626" stroke-width="3"/>
  <polygon points="270,90 256,83 256,97" fill="#dc2626"/>
  <text x="285" y="88" font-size="13" fill="#dc2626" font-weight="700">2v</text>

  <!-- centre v -->
  <line x1="170" y1="150" x2="230" y2="150" stroke="#059669" stroke-width="3"/>
  <polygon points="230,150 216,143 216,157" fill="#059669"/>
  <text x="240" y="148" font-size="13" fill="#059669" font-weight="700">v</text>

  <!-- contact 0 -->
  <circle cx="170" cy="210" r="5" fill="#7c3aed"/>
  <text x="170" y="235" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">v = 0</text>

  <!-- rotation arrow -->
  <path d="M 120 150 A 50 50 0 0 1 170 100" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <polygon points="170,100 158,106 166,114" fill="#ea580c"/>
  <text x="110" y="120" font-size="12" fill="#ea580c" font-weight="700">&#969;</text>

  <!-- Incline -->
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Rolling down an incline</text>
  <polygon points="360,250 620,250 620,110" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="520" cy="150" r="30" fill="#dc2626" opacity="0.85"/>
  <circle cx="520" cy="150" r="3" fill="#fff"/>
  <!-- accel arrow along incline -->
  <line x1="520" y1="150" x2="470" y2="177" stroke="#0f172a" stroke-width="3"/>
  <polygon points="470,177 484,174 479,187" fill="#0f172a"/>
  <text x="470" y="200" font-size="12" fill="#0f172a" font-weight="700">a</text>
  <!-- angle -->
  <path d="M 420 250 A 30 30 0 0 0 448 237" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="440" y="243" font-size="12" fill="#059669" font-weight="700">&#952;</text>

  <!-- formulas -->
  <line x1="40" y1="285" x2="620" y2="285" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330" y="312" text-anchor="middle" font-size="13.5" fill="#0f172a" font-weight="700">a = g sin&#952; / (1 + k&#178;/R&#178;)      K = &#189;Mv&#178;(1 + k&#178;/R&#178;)</text>
  <text x="330" y="338" text-anchor="middle" font-size="12" fill="#475569">Race order (fastest &#8594; slowest): solid sphere &#8594; disc &#8594; hollow sphere &#8594; ring &#8212; independent of M and R</text>
</svg>
