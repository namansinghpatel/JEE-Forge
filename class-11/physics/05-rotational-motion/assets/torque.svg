<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Torque  τ = r × F</text>

  <!-- pivot -->
  <circle cx="120" cy="210" r="8" fill="#0f172a"/>
  <text x="120" y="235" text-anchor="middle" font-size="12" fill="#475569">pivot / axis</text>

  <!-- position vector r -->
  <line x1="120" y1="210" x2="400" y2="120" stroke="#2563eb" stroke-width="3"/>
  <polygon points="400,120 385,120 392,133" fill="#2563eb"/>
  <text x="255" y="155" font-size="14" fill="#2563eb" font-weight="700">r</text>

  <!-- point of application -->
  <circle cx="400" cy="120" r="6" fill="#dc2626"/>

  <!-- Force F -->
  <line x1="400" y1="120" x2="400" y2="40" stroke="#dc2626" stroke-width="3"/>
  <polygon points="400,40 393,55 407,55" fill="#dc2626"/>
  <text x="414" y="60" font-size="14" fill="#dc2626" font-weight="700">F</text>

  <!-- angle theta between r and F -->
  <path d="M 420 120 A 20 20 0 0 0 413 102" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="432" y="110" font-size="12" fill="#059669" font-weight="700">θ</text>

  <!-- moment arm (perpendicular distance from pivot to line of F) -->
  <line x1="120" y1="210" x2="120" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="40" x2="400" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="40" x2="120" y2="210" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="120,210 113,196 127,196" fill="#7c3aed"/>
  <text x="70" y="130" font-size="12" fill="#7c3aed" font-weight="700">r⊥ = r sinθ</text>
  <text x="70" y="148" font-size="11" fill="#7c3aed">(moment arm)</text>

  <!-- formulas -->
  <text x="320" y="270" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">|τ| = r F sinθ = F · r⊥</text>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#475569">Force through the pivot (θ = 0) ⇒ zero torque (push at a door hinge does nothing)</text>
</svg>
