<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Conservation of Angular Momentum</text>
  <text x="320" y="52" text-anchor="middle" font-size="13" fill="#64748b">No external torque  &#8658;  L = I&#969; = constant</text>

  <!-- Skater arms out -->
  <text x="160" y="90" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Arms out: large I, small &#969;</text>
  <circle cx="160" cy="130" r="14" fill="#2563eb"/>
  <line x1="160" y1="144" x2="160" y2="215" stroke="#2563eb" stroke-width="5"/>
  <line x1="160" y1="165" x2="80" y2="150" stroke="#2563eb" stroke-width="5"/>
  <line x1="160" y1="165" x2="240" y2="150" stroke="#2563eb" stroke-width="5"/>
  <line x1="160" y1="215" x2="135" y2="265" stroke="#2563eb" stroke-width="5"/>
  <line x1="160" y1="215" x2="185" y2="265" stroke="#2563eb" stroke-width="5"/>
  <!-- small spin arrow -->
  <path d="M 110 290 A 50 14 0 1 0 210 290" fill="none" stroke="#059669" stroke-width="3"/>
  <polygon points="210,290 198,283 199,297" fill="#059669"/>
  <text x="250" y="294" font-size="13" fill="#059669" font-weight="700">&#969;&#8321;</text>

  <!-- arrow between -->
  <line x1="300" y1="180" x2="360" y2="180" stroke="#0f172a" stroke-width="3"/>
  <polygon points="360,180 346,173 346,187" fill="#0f172a"/>
  <text x="330" y="168" text-anchor="middle" font-size="12" fill="#0f172a">pull in</text>

  <!-- Skater arms in -->
  <text x="480" y="90" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Arms in: small I, large &#969;</text>
  <circle cx="480" cy="130" r="14" fill="#dc2626"/>
  <line x1="480" y1="144" x2="480" y2="215" stroke="#dc2626" stroke-width="5"/>
  <line x1="480" y1="160" x2="455" y2="200" stroke="#dc2626" stroke-width="5"/>
  <line x1="480" y1="160" x2="505" y2="200" stroke="#dc2626" stroke-width="5"/>
  <line x1="480" y1="215" x2="465" y2="265" stroke="#dc2626" stroke-width="5"/>
  <line x1="480" y1="215" x2="495" y2="265" stroke="#dc2626" stroke-width="5"/>
  <!-- big spin arrow -->
  <path d="M 445 288 A 32 12 0 1 1 515 288" fill="none" stroke="#059669" stroke-width="4"/>
  <polygon points="515,288 503,281 504,295" fill="#059669"/>
  <text x="540" y="292" font-size="14" fill="#059669" font-weight="700">&#969;&#8322; &gt; &#969;&#8321;</text>

  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#475569">K = L&#178;/2I rises as I falls &#8212; the extra energy is the muscular work done pulling in</text>
</svg>
