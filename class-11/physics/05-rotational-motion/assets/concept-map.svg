<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rotational Motion — Concept Map</text>

  <!-- connectors (under boxes) -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="550" y1="88" x2="115" y2="128"/>
    <line x1="550" y1="88" x2="330" y2="128"/>
    <line x1="550" y1="88" x2="620" y2="128"/>
    <line x1="550" y1="88" x2="960" y2="128"/>
    <line x1="330" y1="168" x2="305" y2="213"/>
    <line x1="620" y1="168" x2="525" y2="213"/>
    <line x1="620" y1="168" x2="715" y2="213"/>
    <line x1="960" y1="168" x2="960" y2="213"/>
    <line x1="525" y1="253" x2="465" y2="298"/>
    <line x1="715" y1="253" x2="720" y2="298"/>
    <line x1="715" y1="253" x2="945" y2="298"/>
    <line x1="962" y1="253" x2="975" y2="298"/>
    <line x1="720" y1="338" x2="720" y2="383"/>
  </g>

  <!-- Tier 0 -->
  <rect x="475" y="50" width="150" height="38" rx="8" fill="#2563eb"/>
  <text x="550" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Rigid Body</text>

  <!-- Tier 1 -->
  <rect x="35" y="130" width="155" height="38" rx="8" fill="#64748b"/>
  <text x="112" y="154" text-anchor="middle" font-size="12.5" fill="#fff">Centre of Mass</text>

  <rect x="245" y="130" width="170" height="38" rx="8" fill="#64748b"/>
  <text x="330" y="154" text-anchor="middle" font-size="12.5" fill="#fff">Rotational Kinematics</text>

  <rect x="540" y="130" width="160" height="38" rx="8" fill="#dc2626"/>
  <text x="620" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Torque  τ = r × F</text>

  <rect x="885" y="130" width="150" height="38" rx="8" fill="#ea580c"/>
  <text x="960" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Rolling Motion</text>

  <!-- Tier 2 -->
  <rect x="200" y="215" width="210" height="38" rx="8" fill="#e2e8f0"/>
  <text x="305" y="239" text-anchor="middle" font-size="11.5" fill="#0f172a">θ, ω, α  +  equations of motion</text>

  <rect x="447" y="215" width="156" height="38" rx="8" fill="#059669"/>
  <text x="525" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Moment of Inertia  I</text>

  <rect x="625" y="215" width="180" height="38" rx="8" fill="#e2e8f0"/>
  <text x="715" y="239" text-anchor="middle" font-size="11.5" fill="#0f172a">Newton's 2nd law:  τ = I α</text>

  <rect x="890" y="215" width="145" height="38" rx="8" fill="#e2e8f0"/>
  <text x="962" y="239" text-anchor="middle" font-size="11.5" fill="#0f172a">v = R ω  (rolling)</text>

  <!-- Tier 3 -->
  <rect x="350" y="300" width="230" height="38" rx="8" fill="#e2e8f0"/>
  <text x="465" y="324" text-anchor="middle" font-size="11" fill="#0f172a">Parallel &amp; Perpendicular axis theorems</text>

  <rect x="625" y="300" width="190" height="38" rx="8" fill="#7c3aed"/>
  <text x="720" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Angular Momentum  L = I ω</text>

  <rect x="890" y="300" width="170" height="38" rx="8" fill="#e2e8f0"/>
  <text x="975" y="324" text-anchor="middle" font-size="11.5" fill="#0f172a">Rotational KE = ½ I ω²</text>

  <!-- Tier 4 -->
  <rect x="605" y="385" width="230" height="38" rx="8" fill="#0891b2"/>
  <text x="720" y="409" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">Conservation of L  (τ_ext = 0)</text>
</svg>
