<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rotational Motion — Concept Map</text>

  <!-- connectors (drawn first, under boxes) -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="465" y1="86" x2="140" y2="133"/>
    <line x1="465" y1="86" x2="300" y2="133"/>
    <line x1="465" y1="86" x2="512" y2="133"/>
    <line x1="465" y1="86" x2="790" y2="133"/>
    <line x1="300" y1="171" x2="300" y2="218"/>
    <line x1="512" y1="171" x2="445" y2="218"/>
    <line x1="512" y1="171" x2="620" y2="218"/>
    <line x1="815" y1="171" x2="820" y2="218"/>
    <line x1="430" y1="256" x2="435" y2="303"/>
    <line x1="627" y1="256" x2="665" y2="303"/>
    <line x1="627" y1="256" x2="815" y2="303"/>
    <line x1="820" y1="256" x2="830" y2="303"/>
    <line x1="672" y1="341" x2="675" y2="388"/>
  </g>

  <!-- Tier 0 -->
  <rect x="390" y="48" width="150" height="38" rx="8" fill="#2563eb"/>
  <text x="465" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Rigid Body</text>

  <!-- Tier 1 -->
  <rect x="40" y="135" width="150" height="36" rx="8" fill="#64748b"/>
  <text x="115" y="158" text-anchor="middle" font-size="12.5" fill="#fff">Centre of Mass</text>

  <rect x="210" y="135" width="180" height="36" rx="8" fill="#64748b"/>
  <text x="300" y="158" text-anchor="middle" font-size="12.5" fill="#fff">Rotational Kinematics</text>

  <rect x="430" y="135" width="165" height="36" rx="8" fill="#dc2626"/>
  <text x="512" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Torque  τ = r × F</text>

  <rect x="740" y="135" width="150" height="36" rx="8" fill="#ea580c"/>
  <text x="815" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Rolling Motion</text>

  <!-- Tier 2 -->
  <rect x="190" y="218" width="220" height="36" rx="8" fill="#e2e8f0"/>
  <text x="300" y="241" text-anchor="middle" font-size="12" fill="#0f172a">θ, ω, α  ·  equations of motion</text>

  <rect x="350" y="218" width="165" height="36" rx="8" fill="#059669"/>
  <text x="432" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Moment of Inertia  I</text>

  <rect x="535" y="218" width="185" height="36" rx="8" fill="#e2e8f0"/>
  <text x="627" y="241" text-anchor="middle" font-size="12" fill="#0f172a">Newton's 2nd law:  τ = I α</text>

  <rect x="745" y="218" width="150" height="36" rx="8" fill="#e2e8f0"/>
  <text x="820" y="241" text-anchor="middle" font-size="12" fill="#0f172a">v = R ω  (rolling)</text>

  <!-- Tier 3 -->
  <rect x="320" y="303" width="230" height="36" rx="8" fill="#e2e8f0"/>
  <text x="435" y="326" text-anchor="middle" font-size="11.5" fill="#0f172a">Parallel &amp; Perpendicular axis theorems</text>

  <rect x="575" y="303" width="195" height="36" rx="8" fill="#7c3aed"/>
  <text x="672" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Angular Momentum  L = I ω</text>

  <rect x="745" y="303" width="165" height="36" rx="8" fill="#e2e8f0"/>
  <text x="827" y="326" text-anchor="middle" font-size="12" fill="#0f172a">Rotational KE = ½ I ω²</text>

  <!-- Tier 4 -->
  <rect x="560" y="388" width="230" height="36" rx="8" fill="#0891b2"/>
  <text x="675" y="411" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Conservation of L  (τ_ext = 0)</text>
</svg>
