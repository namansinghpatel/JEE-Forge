<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="640" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Angular Kinematics</text>

  <!-- Circle -->
  <circle cx="230" cy="190" r="120" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="230" cy="190" r="4" fill="#0f172a"/>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#475569">axis (O)</text>

  <!-- radius to point P -->
  <line x1="230" y1="190" x2="314" y2="105" stroke="#2563eb" stroke-width="3"/>
  <text x="285" y="135" font-size="13" fill="#2563eb" font-weight="700">R</text>
  <circle cx="314" cy="105" r="7" fill="#dc2626"/>
  <text x="326" y="100" font-size="13" fill="#dc2626" font-weight="700">P</text>

  <!-- angular displacement arc -->
  <path d="M 350 190 A 120 120 0 0 0 314 105" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="360" y="150" font-size="14" fill="#059669" font-weight="700">θ</text>

  <!-- tangential velocity -->
  <line x1="314" y1="105" x2="392" y2="138" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="392,138 379,133 384,146" fill="#7c3aed"/>
  <text x="400" y="135" font-size="12" fill="#7c3aed" font-weight="700">v = Rω</text>

  <!-- centripetal acceleration (toward centre) -->
  <line x1="314" y1="105" x2="272" y2="148" stroke="#ea580c" stroke-width="3"/>
  <polygon points="272,148 286,146 280,133" fill="#ea580c"/>
  <text x="250" y="130" font-size="11" fill="#ea580c" font-weight="700">a꜀ = ω²R</text>

  <!-- tangential acceleration -->
  <line x1="314" y1="105" x2="366" y2="127" stroke="#0891b2" stroke-width="3" stroke-dasharray="5 3"/>
  <polygon points="366,127 353,124 358,137" fill="#0891b2"/>
  <text x="372" y="115" font-size="11" fill="#0891b2" font-weight="700">aₜ = Rα</text>

  <!-- equations panel -->
  <line x1="470" y1="70" x2="470" y2="300" stroke="#e2e8f0" stroke-width="2"/>
  <text x="490" y="110" font-size="13" fill="#0f172a" font-weight="700">Equations (const. α)</text>
  <text x="490" y="140" font-size="13" fill="#1e293b">ω = ω₀ + αt</text>
  <text x="490" y="166" font-size="13" fill="#1e293b">θ = ω₀t + ½αt²</text>
  <text x="490" y="192" font-size="13" fill="#1e293b">ω² = ω₀² + 2αθ</text>
  <text x="490" y="236" font-size="12" fill="#475569" font-weight="700">Total accel</text>
  <text x="490" y="260" font-size="13" fill="#1e293b">a = √(aₜ² + a꜀²)</text>
</svg>
